<table mat-table [dataSource]="rows()" matSort (matSortChange)="sort.set($event)">
  <ng-container matColumnDef="number">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>N°</th>
    <td mat-cell *matCellDef="let row">{{ row.number }}</td>
  </ng-container>

  <ng-container matColumnDef="groupName">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Groupe</th>
    <td mat-cell *matCellDef="let row">{{ row.groupName }}</td>
  </ng-container>

  <ng-container matColumnDef="company">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Entreprise</th>
    <td mat-cell *matCellDef="let row">{{ row.company }}</td>
  </ng-container>

  <ng-container matColumnDef="jobTitle">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Poste</th>
    <td mat-cell *matCellDef="let row">{{ row.jobTitle }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Statut</th>
    <td mat-cell *matCellDef="let row">
      @if (statusOf(row); as status) {
        <app-status-badge [status]="status" />
      }
    </td>
  </ng-container>

  <ng-container matColumnDef="sentOn">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Envoyée le</th>
    <td mat-cell *matCellDef="let row">{{ row.sentOn | date: 'dd/MM/yyyy' }}</td>
  </ng-container>

  <ng-container matColumnDef="deadlineLabel">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Échéance</th>
    <td mat-cell *matCellDef="let row">{{ row.deadlineLabel }}</td>
  </ng-container>

  <ng-container matColumnDef="deadlineDate">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Date échéance</th>
    <td mat-cell *matCellDef="let row">
      <app-deadline-cell [date]="row.deadlineDate" [closed]="isClosed(row)" [today]="today" />
    </td>
  </ng-container>

  <ng-container matColumnDef="notes">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Prochaine action</th>
    <td mat-cell *matCellDef="let row">
      @if (row.notes) {
        <!-- Tronquées sur une ligne ; le texte complet reste lisible en info-bulle, y compris au clavier -->
        <span class="notes" tabindex="0" [matTooltip]="row.notes" matTooltipClass="notes-tooltip">{{
          row.notes
        }}</span>
      }
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns" [class.closed]="isClosed(row)"></tr>
</table>
