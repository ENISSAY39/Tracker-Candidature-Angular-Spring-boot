<mat-toolbar>
  <span class="title">Tracker de candidatures</span>
  <nav aria-label="Navigation principale">
    @for (link of links; track link.path) {
      <a
        mat-button
        [routerLink]="link.path"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        >{{ link.label }}</a
      >
    }
  </nav>
  <app-backup-indicator />
  <button mat-button type="button" class="theme" [matMenuTriggerFor]="themeMenu">
    Thème : {{ themeLabel() }}
  </button>
  <mat-menu #themeMenu="matMenu">
    @for (option of themeModes; track option.mode) {
      <button
        mat-menu-item
        type="button"
        role="menuitemradio"
        [attr.aria-checked]="theme.mode() === option.mode"
        [class.selected]="theme.mode() === option.mode"
        (click)="theme.select(option.mode)"
      >
        {{ option.label }}
      </button>
    }
  </mat-menu>
</mat-toolbar>
<main>
  <ng-content />
</main>
