server {
  listen 80;
  root /usr/share/nginx/html;

  # API : relayée au backend par le réseau Compose ; même origine pour le navigateur, donc pas de CORS
  location /api {
    proxy_pass http://backend:8080;
  }

  # Routes Angular (/applications, /groups/3…) : tout ce qui n'est pas un fichier retombe sur index.html
  location / {
    try_files $uri /index.html;
  }
}
