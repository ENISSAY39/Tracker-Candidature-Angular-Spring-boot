server {
  listen 8080;
  root /usr/share/nginx/html;

  # API : relayée au backend par le réseau Compose ; même origine pour le navigateur, donc pas de CORS
  location /api {
    proxy_pass http://backend:8080;
    # Envoi du classeur : même limite que le backend (spring.servlet.multipart, 10 Mo)
    client_max_body_size 10m;
  }

  # Routes Angular (/applications, /groups/3…) : tout ce qui n'est pas un fichier retombe sur index.html
  location / {
    try_files $uri /index.html;
  }
}
