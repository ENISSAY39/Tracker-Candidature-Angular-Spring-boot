spring:
  application:
    name: tracker
  # Dev local : lit le .env de la racine s'il existe (lancement depuis backend/)
  config:
    import: optional:file:../.env[.properties]
  # Base de compose.yaml sur 127.0.0.1:5432 ; en conteneur, SPRING_DATASOURCE_* prend le dessus
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:tracker}
    username: ${POSTGRES_USER:tracker}
    password: ${POSTGRES_PASSWORD:tracker}
  # Schéma créé par Flyway uniquement ; Hibernate se contente de le valider
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # Import du classeur : envoi limité à 10 Mo
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Interface en français seulement : messages de validation en français, sans tenir compte d'Accept-Language
  web:
    locale: fr_FR
    locale-resolver: fixed

server:
  port: 8081

tracker:
  backup:
    # Dossier des sauvegardes, lu pour afficher la dernière dans l'appli ; relatif à backend/ en dev local,
    # /backups en conteneur (TRACKER_BACKUP_DIRECTORY). À surcharger si BACKUP_DIR vise un autre dossier.
    directory: ../data/backups
    # Vrai en conteneur (TRACKER_BACKUP_REQUIRED) : un dossier illisible y signale un montage cassé, et l'indicateur
    # de la barre de titre passe en alerte. Faux en dev local, où l'API ne voit pas forcément le dossier.
    required: false
